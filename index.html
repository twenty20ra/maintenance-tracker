<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲維護時間管理系統</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }
    input, select, button {
      font-size: 14px;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- 頁面標題 -->
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 bg-white p-6 rounded-xl shadow-md">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">
          🛠️ 遊戲維護即時追蹤系統
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          客服同仁即時同步、自動提醒與狀態登記
        </p>
      </div>

      <button
        id="enableAudioBtn"
        type="button"
        class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow font-medium transition"
      >
        🔔 允許通知與音效
      </button>
    </header>

    <!-- 新增維護計畫 -->
    <section class="bg-white p-4 rounded-xl shadow-md">
      <h2 class="text-lg font-semibold text-slate-800 mb-3">
        ➕ 登記新維護計畫
      </h2>

      <form id="maintenanceForm" class="grid grid-cols-1 md:grid-cols-2 gap-3">

        <!-- 遊戲館別 -->
        <div class="md:col-span-2">
          <label for="vendorName" class="block text-sm text-slate-500 mb-1">
            遊戲館別
          </label>
          <input
            type="text"
            id="vendorName"
            required
            maxlength="100"
            placeholder="例如：RSG電子"
            class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
          >
        </div>

        <!-- 維護開始時間 -->
        <div>
          <label for="startInput" class="block text-sm text-slate-500 mb-1">
            維護開始時間
          </label>
          <input
            type="text"
            id="startInput"
            inputmode="numeric"
            maxlength="10"
            autocomplete="off"
            required
            class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
          >
          <p class="text-xs text-slate-400 mt-1">
            格式：YYMMDDHHmm，例如 2610192300
          </p>
        </div>

        <!-- 維護結束時間 -->
        <div>
          <label for="endInput" class="block text-sm text-slate-500 mb-1">
            維護結束時間
          </label>
          <input
            type="text"
            id="endInput"
            inputmode="numeric"
            maxlength="10"
            autocomplete="off"
            required
            class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
          >
          <p class="text-xs text-slate-400 mt-1">
            格式：YYMMDDHHmm，例如 2610200100
          </p>
        </div>

        <!-- 登記客服 -->
        <div class="md:col-span-2">
          <label for="staffName" class="block text-sm text-slate-500 mb-1">
            登記客服
          </label>
          <input
            type="text"
            id="staffName"
            required
            maxlength="100"
            placeholder="例如：小明"
            class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
          >
        </div>

        <!-- 儲存按鈕 -->
        <div class="md:col-span-2 text-right">
          <button
            type="submit"
            id="saveBtn"
            class="px-6 py-2 bg-slate-900 hover:bg-slate-700 text-white rounded-lg font-medium transition"
          >
            儲存並同步
          </button>
        </div>
      </form>
    </section>

    <!-- 維護計畫總覽 -->
    <section class="bg-white p-6 rounded-xl shadow-md space-y-4">
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
        <h2 class="text-lg font-semibold text-slate-800">
          📋 維護計畫總覽
        </h2>
        <span class="text-xs text-slate-400">
          ⚡ 雲端即時監控中
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[850px]">
          <thead>
            <tr class="border-b text-xs font-semibold text-slate-500 bg-slate-50">
              <th class="py-3 px-4">遊戲館別</th>
              <th class="py-3 px-4">維護區間（24 小時制）</th>
              <th class="py-3 px-4 text-center">開始：確認關閉</th>
              <th class="py-3 px-4 text-center">結束：確認開啟</th>
              <th class="py-3 px-4">狀態</th>
              <th class="py-3 px-4 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="listBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="6" class="text-center py-6 text-slate-400">
                資料載入中...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- 頁面內通知區 -->
  <div id="noticeArea" class="fixed top-4 right-4 z-50 space-y-2 w-[min(92vw,380px)]" aria-live="polite"></div>

  <!-- Firebase 與系統功能 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcMcRrmiOMQm02hSIsmUiRiyKlKrkbZN0",
      authDomain: "maintenance-tracker-bifa.firebaseapp.com",
      projectId: "maintenance-tracker-bifa",
      storageBucket: "maintenance-tracker-bifa.firebasestorage.app",
      messagingSenderId: "379518766880",
      appId: "1:379518766880:web:69b53509c761c857731145",
      measurementId: "G-E9P7K9JTDT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const maintenanceRef = collection(db, "maintenances");

    let records = [];
    let audioContext = null;
    const notifiedKeys = new Set();
    const $ = (id) => document.getElementById(id);

    ["startInput", "endInput"].forEach((id) => {
      $(id).addEventListener("input", (event) => {
        event.target.value = event.target.value.replace(/\D/g, "").slice(0, 10);
      });
    });

    function parseCompactDateTime(value) {
      const input = String(value ?? "").trim();
      if (!/^\d{10}$/.test(input)) return "";

      const year = 2000 + Number(input.slice(0, 2));
      const month = Number(input.slice(2, 4));
      const day = Number(input.slice(4, 6));
      const hour = Number(input.slice(6, 8));
      const minute = Number(input.slice(8, 10));

      if (month < 1 || month > 12 || day < 1 || day > 31 || hour < 0 || hour > 23 || minute < 0 || minute > 59) return "";

      const date = new Date(year, month - 1, day, hour, minute);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day || date.getHours() !== hour || date.getMinutes() !== minute) {
        return "";
      }

      return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}T${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function formatDateTime(value) {
      if (!value) return "";
      return String(value).replace("T", " ").slice(0, 16);
    }

    onSnapshot(maintenanceRef, (snapshot) => {
      records = [];
      snapshot.forEach((docSnap) => {
        records.push({ id: docSnap.id, ...docSnap.data() });
      });

      records.sort((a, b) => new Date(a.startTime) - new Date(b.startTime));
      renderList();
      checkMaintenanceAlerts();
    }, (error) => {
      console.error("Firebase 讀取錯誤：", error);
      $("listBody").innerHTML = `<tr><td colspan="6" class="text-center py-6 text-red-500">連線失敗，請檢查資料庫規則與網路。</td></tr>`;
    });

    $("maintenanceForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const saveBtn = $("saveBtn");
      if (saveBtn.disabled) return;

      const vendorName = $("vendorName").value.trim();
      const startTime = parseCompactDateTime($("startInput").value);
      const endTime = parseCompactDateTime($("endInput").value);
      const staffName = $("staffName").value.trim();

      if (!vendorName || !staffName || !startTime || !endTime) {
        alert("請確認所有欄位都已正確填寫（時間需為 10 碼數字）！");
        return;
      }

      if (new Date(endTime) <= new Date(startTime)) {
        alert("維護結束時間必須晚於開始時間！");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "儲存中...";

      try {
        await addDoc(maintenanceRef, {
          vendorName,
          startTime,
          endTime,
          createdBy: staffName,
          isClosed: false,
          closedBy: "",
          isOpened: false,
          openedBy: "",
          preStartNotified: false,
          lastStartNotifyTime: 0,
          lastEndNotifyTime: 0,
          createdAt: serverTimestamp()
        });

        $("maintenanceForm").reset();
        alert("儲存成功！");
      } catch (error) {
        alert("儲存失敗：" + error.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "儲存並同步";
      }
    });

    function escapeHTML(str) {
      return String(str ?? "").replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function renderList() {
      const listBody = $("listBody");
      if (records.length === 0) {
        listBody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">目前尚無維護排程。</td></tr>`;
        return;
      }

      const now = new Date();
      listBody.innerHTML = records.map((item) => {
        const start = new Date(item.startTime);
        const end = new Date(item.endTime);
        let statusBadge = `<span class="px-2 py-1 text-xs rounded-full bg-slate-100 text-slate-600">未開始</span>`;
        if (now >= start && now <= end) {
          statusBadge = `<span class="px-2 py-1 text-xs rounded-full bg-amber-100 text-amber-800 font-semibold">維護中</span>`;
        } else if (now > end) {
          statusBadge = `<span class="px-2 py-1 text-xs rounded-full bg-emerald-100 text-emerald-800">已結束</span>`;
        }

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-medium text-slate-900">
              ${escapeHTML(item.vendorName)}
              <div class="text-xs text-slate-400 mt-1">登記：${escapeHTML(item.createdBy)}</div>
            </td>
            <td class="py-3 px-4 text-xs text-slate-500 whitespace-nowrap">
              <div>開始：${escapeHTML(formatDateTime(item.startTime))}</div>
              <div class="mt-1">結束：${escapeHTML(formatDateTime(item.endTime))}</div>
            </td>
            <td class="py-3 px-4 text-center">
              <label class="inline-flex items-center gap-2 cursor-pointer">
                <input type="checkbox" ${item.isClosed ? "checked" : ""} onchange="toggleStatus('${escapeHTML(item.id)}', 'isClosed', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                <span class="text-xs text-slate-500">${item.isClosed ? `✅ ${escapeHTML(item.closedBy || '已關閉')}` : "未關閉"}</span>
              </label>
            </td>
            <td class="py-3 px-4 text-center">
              <label class="inline-flex items-center gap-2 cursor-pointer">
                <input type="checkbox" ${item.isOpened ? "checked" : ""} onchange="toggleStatus('${escapeHTML(item.id)}', 'isOpened', this.checked)" class="w-4 h-4 text-emerald-600 rounded">
                <span class="text-xs text-slate-500">${item.isOpened ? `✅ ${escapeHTML(item.openedBy || '已開啟')}` : "未開啟"}</span>
              </label>
            </td>
            <td class="py-3 px-4 whitespace-nowrap">${statusBadge}</td>
            <td class="py-3 px-4 text-center">
              <div class="flex flex-col items-center gap-2">
                <button type="button" onclick="extendRecord('${escapeHTML(item.id)}')" class="text-xs text-indigo-600 hover:text-indigo-800 underline">延長</button>
                <button type="button" onclick="deleteRecord('${escapeHTML(item.id)}')" class="text-xs text-red-500 hover:text-red-700 underline">刪除</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function toLocalCompactDateTime(date) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${String(date.getFullYear()).slice(-2)}${pad(date.getMonth() + 1)}${pad(date.getDate())}${pad(date.getHours())}${pad(date.getMinutes())}`;
    }

    window.toggleStatus = async (id, field, value) => {
      const name = prompt("請輸入您的姓名以確認操作：");
      if (!name || !name.trim()) { renderList(); return; }
      const updateData = { [field]: value };
      if (field === "isClosed") updateData.closedBy = value ? name.trim() : "";
      if (field === "isOpened") {
        updateData.openedBy = value ? name.trim() : "";
        // 勾選「已開啟」代表維護實際結束；將結束時間改成此刻，且不再提醒結束。
        if (value) {
          const now = new Date();
          updateData.endTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}T${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
        }
      }
      try {
        await updateDoc(doc(db, "maintenances", id), updateData);
      } catch (error) {
        alert("更新失敗：" + error.message);
        renderList();
      }
    };

    window.extendRecord = async (id) => {
      const item = records.find((record) => record.id === id);
      if (!item) return;
      const currentCompact = toLocalCompactDateTime(new Date(item.endTime));
      const input = prompt("請輸入新的維護結束時間（10 碼 YYMMDDHHmm，例如 2610200130）：", currentCompact);
      if (input === null) return;
      const newEndTime = parseCompactDateTime(input);
      if (!newEndTime) { alert("格式不正確，請輸入 10 碼時間，例如 2610200130。"); return; }
      if (new Date(newEndTime) <= new Date(item.startTime)) { alert("結束時間必須晚於維護開始時間！"); return; }
      try {
        await updateDoc(doc(db, "maintenances", id), { endTime: newEndTime, isOpened: false, openedBy: "" });
        alert("維護結束時間已更新！");
      } catch (error) { alert("延長失敗：" + error.message); }
    };

    window.deleteRecord = async (id) => {
      if (confirm("確定要刪除這筆排程紀錄嗎？")) {
        await deleteDoc(doc(db, "maintenances", id));
      }
    };

    function showPageNotice(title, message, kind = "info") {
      const area = $("noticeArea");
      const card = document.createElement("div");
      card.className = `rounded-xl shadow-lg border p-4 bg-white ${kind === "urgent" ? "border-amber-400" : "border-slate-200"}`;
      const header = document.createElement("div");
      header.className = "flex items-start justify-between gap-3";
      const heading = document.createElement("div");
      heading.className = "font-bold text-slate-900";
      heading.textContent = title;
      const closeButton = document.createElement("button");
      closeButton.type = "button";
      closeButton.className = "shrink-0 rounded-md px-2 py-1 -mt-1 -mr-1 text-slate-500 hover:bg-slate-100 hover:text-slate-900";
      closeButton.setAttribute("aria-label", "關閉通知");
      closeButton.title = "關閉通知";
      closeButton.textContent = "✕";
      closeButton.addEventListener("click", () => card.remove());
      header.append(heading, closeButton);
      const body = document.createElement("div");
      body.className = "text-sm text-slate-600 mt-1";
      body.textContent = message;
      card.append(header, body);
      area.prepend(card);
    }

    function playAlertSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioContext = audioContext || new Ctx();
        if (audioContext.state === "suspended") audioContext.resume();
        const now = audioContext.currentTime;
        // 五聲較響亮的雙音提示；實際音量仍受電腦系統音量控制。
        const notes = [880, 1046.5, 880, 1174.7, 1046.5];
        notes.forEach((frequency, index) => {
          const offset = index * 0.24;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = "triangle";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.42, now + offset + 0.025);
          gain.gain.setValueAtTime(0.42, now + offset + 0.11);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.21);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now + offset);
          oscillator.stop(now + offset + 0.23);
        });
      } catch (error) {
        console.warn("無法播放提醒音效：", error);
      }
    }

    function sendMaintenanceAlert(key, title, message) {
      if (notifiedKeys.has(key)) return;
      notifiedKeys.add(key);
      showPageNotice(title, message, "urgent");
      playAlertSound();
      if ("Notification" in window && Notification.permission === "granted") {
        try { new Notification(title, { body: message, tag: key, requireInteraction: true }); }
        catch (error) { console.warn("瀏覽器通知未能顯示：", error); }
      }
    }

    function checkMaintenanceAlerts() {
      const now = Date.now();
      for (const item of records) {
        if (!item.startTime || !item.endTime) continue;
        const start = new Date(item.startTime).getTime();
        const end = new Date(item.endTime).getTime();
        if (!Number.isFinite(start) || !Number.isFinite(end)) continue;
        const name = item.vendorName || "未命名維護";
        // 僅在維護開始前 5 分鐘提醒；若這時才開啟頁面，也會補提醒一次。
        if (now >= start - 5 * 60 * 1000 && now < start && !item.isClosed) {
          sendMaintenanceAlert(`${item.id}-prestart`, `⏰ 維護即將開始：${name}`, `預計開始時間：${formatDateTime(item.startTime)}（5 分鐘後開始）`);
        }
        // 到達預計結束時間時提醒客服確認開啟；已勾選開啟就不再提醒。
        if (now >= end && !item.isOpened) {
          sendMaintenanceAlert(`${item.id}-end-${item.endTime}`, `🔔 請確認維護已結束：${name}`, `預計結束時間已到：${formatDateTime(item.endTime)}。請確認遊戲是否已開啟。`);
        }
      }
    }

    window.enableAudio = async () => {
      // 由使用者點擊啟動音效，避免瀏覽器阻擋自動播放。
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          audioContext = audioContext || new Ctx();
          if (audioContext.state === "suspended") await audioContext.resume();
          playAlertSound();
        }
      } catch (error) { console.warn("音效啟動失敗：", error); }
      if ("Notification" in window) {
        const perm = await Notification.requestPermission();
        const message = perm === "granted"
          ? "電腦通知已允許，音效測試已播放。頁面保持開啟時，會在維護開始前 5 分鐘提醒。"
          : "瀏覽器通知權限未開啟；網頁內提醒仍會顯示，但請允許通知以接收電腦右下角提醒。";
        alert(message);
      } else {
        alert("此瀏覽器不支援電腦通知；網頁內提醒與音效仍可使用。請保持此頁開啟。 ");
      }
    };
    $("enableAudioBtn").addEventListener("click", window.enableAudio);
    // 每 15 秒檢查一次，網頁保持開啟時執行。
    setInterval(checkMaintenanceAlerts, 15000);
  </script>
</body>
</html>
